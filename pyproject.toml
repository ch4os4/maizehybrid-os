[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maizehybrid-os"
version = "0.1.0"
description = "Maize hybrid breeding pipeline OS — germplasm, cross prediction, trials, traits, traceability"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
